# The Senior Design page and the home card read this file. Newest year first.
# image: a file in static/design/ (optional), shown as a banner across the top of the card. link: a demo or thesis page (optional).
# full: a different image to open on click, when the banner is a crop of something bigger (optional).
# imagepos: which part of the image shows in the banner, e.g. center top (optional). Clicking the banner shows the full image.
# links: a list of text and url pairs, for a card with more than one link (optional).
# page and program on a year link to the conference page and the program PDF in static/design/.

years:
  - year: "2027"
    projects:
      - title: "PitchLink: Film-Only Player Tracking and Semantic-Aware Delivery of Match-Critical Data in Stadium Networks"
        team: Derek Chui, Ramon Anaya, Pedro Aguirre-Salas, Monica Reyes, Collin Fiske
        advisors: Krishna Ramamoorthy
        status: In progress
        image: pitchlink.jpg
        full: pitchlink-full.jpg
        link: https://derekchui.com/pitchlink/
        linktext: PitchLink
        description: Most clubs below the top professional leagues have match film but no tracking data, and even the insights they can get rarely reach the coach while a decision is still open. This project addresses that as one pipeline, from film to tracking to insight, delivered live. It reconstructs player and ball tracking from match film alone, turns that tracking into insights such as pitch control, and delivers them over a stadium network that prioritizes traffic by its relevance to the match.

      - title: Agent-Based Adaptive RSMA for 6G with FPGA-Activated Receiver-Side SIC
        team: Guangyi Liu, Milan Djurovic
        advisors: Krishna Ramamoorthy
        status: In progress

      - title: Adaptive Game Theoretic Defense Against Blackhole and Greyhole Attacks in AODV Networks
        team: Ariana Sun
        advisors: Krishna Ramamoorthy
        status: In progress
        description: Drones that relay each other's traffic can be undermined by a malicious relay that silently drops packets, either all of them (a blackhole) or some of them (a greyhole). This project models the defense as a Stackelberg game, where the network commits to a level of monitoring and the attacker then picks how much to drop. Solving it gives the minimum monitoring effort that makes attacking unprofitable, and when that is too costly, how much dropping to expect. The model is written to carry straight into an ns-3 evaluation.

      - title: AI-Powered Lending and Risk Assessment System
        team: Kai Wong, Kate Picca, Risha Desai, Tess Wei
        advisors: Krishna Ramamoorthy
        status: In progress
        image: motohope.jpg
        description: Moto Hope is a small, impact-first investing company in Kenya. This project is building an AI-based risk assessment tool for its lending, predicting the repayment and default risk of a new loan from borrower data such as M-Pesa activity, credit bureau status and past Moto Hope loans.
        link: /design/motohope-presentation.pdf
        linktext: Presentation

