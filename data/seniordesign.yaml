      - title: HALoN (High Altitude LoRa Networking) for Crisis Communications
        team: Sahana Chandramohan, Vikram Jangid
        advisors: Kurt Schab, Krishna Ramamoorthy
        image: halon.jpg
        imagepos: center 12%
        awards:
          - Engineering Ethics Prize
        description: HALoN strives to provide an accessible, crisis-aware emergency communication system to provide connection in times of disaster. It utilizes a LoRa mesh network, reconfigurable antennas and a light-weight machine learning scheduling algorithm.
        links:
          - text: Thesis
            url: /design/halon-thesis.pdf
          - text: Presentation
            url: /design/halon-presentation.pdf

      - title: Wearable Hazard Detection System for the Visually Impaired
        team: Nolan Daly, Sergio Diaz, Brandon Ng
        advisors: Krishna Ramamoorthy
        image: wearable.png
        description: Aimed at assisting the visually impaired, our device pairs wide-angle camera vision with AI-based object detection to identify a range of potential obstacles, including rapidly approaching or elevated hazards. When a hazard is detected, haptic feedback alerts the wearer to its position.
        link: https://scholarcommons.scu.edu/cseng_senior/376
        linktext: Thesis

